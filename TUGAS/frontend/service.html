<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="#" class="logo">
          <img src="/public/reparin-icon.png" alt="Reparin Logo" />
        </a>

        <!-- Hamburger Menu Button -->
        <button class="hamburger-menu" aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="navbar">
          <ul>
            <li><a href="index.html">Beranda</a></li>
            <li><a href="index.html#features">Fitur</a></li>
            <li><a href="#services">Layanan</a></li>
            <li><a href="index.html#testimonials">Testimoni</a></li>
            <li><a href="index.html#contact">Kontak</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="wrapper">
      <section id="services" class="features">
        <div class="container">
          <h2>Available Services</h2>
          <div class="features-grid">
            <table id="serviceTable" class="feature-card">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Description</th>
                  <th>Category</th>
                  <th>Price Range</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <!-- Dynamic data -->
              </tbody>
            </table>
          </div>
        </div>
      </section>
      <section class="features">
        <div class="container">
          <h2 id="formTitle">Add New Service</h2>
          <form id="serviceForm" class="contact-form">
            <input type="hidden" id="serviceId" />
            <div>
              <label for="name">Name:</label>
              <input type="text" id="name" required />
            </div>
            <div>
              <label for="description">Description:</label>
              <textarea id="description" required></textarea>
            </div>
            <div>
              <label for="category">Category:</label>
              <input type="text" id="category" required />
            </div>
            <div>
              <label for="priceRange">Price Range:</label>
              <input type="text" id="priceRange" required />
            </div>
            <div>
              <button type="submit">Save</button>
              <button type="button" id="cancelButton" style="display: none">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="container">
        <p>&copy; 2024 Service Management. All Rights Reserved. hisyam99</p>
      </div>
    </footer>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const hamburgerMenu = document.querySelector(".hamburger-menu");
        const navbar = document.querySelector(".navbar");

        hamburgerMenu.addEventListener("click", () => {
          hamburgerMenu.classList.toggle("active");
          navbar.classList.toggle("active");
        });

        // Tutup Menu ketika menekan tombol Menu atau Menekan bebas diluar area Menu
        document.addEventListener("click", (event) => {
          const isClickInsideNavbar = navbar.contains(event.target);
          const isClickHamburger = hamburgerMenu.contains(event.target);

          if (!isClickInsideNavbar && !isClickHamburger) {
            hamburgerMenu.classList.remove("active");
            navbar.classList.remove("active");
          }
        });

        // Tutup Menu ketika link di navigasi menu diklik
        navbar.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", () => {
            hamburgerMenu.classList.remove("active");
            navbar.classList.remove("active");
          });
        });
      });
    </script>
    <script src="script.js"></script>
  </body>
</html>
